name: Update data

on:
  schedule:
    # Times are UTC. 07:45 UTC = 9:45 pm HST (after the evening nets, before the
    # 40meter.net log resets at month end); 22:45 UTC = 12:45 pm HST.
    - cron: '45 7 * * *'
    - cron: '45 22 * * *'
  workflow_dispatch: {}     # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The FCC license file (~200 MB) is only re-downloaded once a week; keep the
      # parsed result between runs.
      - name: Restore FCC cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fcc-${{ github.run_id }}
          restore-keys: fcc-

      - name: Collect data
        run: python3 collector/collect.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history docs/data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(TZ=Pacific/Honolulu date '+%Y-%m-%d %H:%M HST')"
            git push
          fi
